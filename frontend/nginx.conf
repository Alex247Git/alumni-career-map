# Alumni Career Map — frontend nginx
# Serves the SPA and reverse-proxies /api/* to the api container
# so the browser talks to a single origin (no CORS setup needed).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API -> Slim API container (pass full /api/v1/... path through)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Everything else -> SPA index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}