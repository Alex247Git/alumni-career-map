<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni DS - Digital Systems Graduates</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
    <!-- Google Charts -->
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- ============ TOAST CONTAINER ============ -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ============ HEADER ============ -->
    <header class="header">
        <div class="container-fluid px-3">
            <div class="row align-items-center">
                <div class="col-md-4 col-6">
                    <h1>
                        <i class="bi bi-mortarboard-fill"></i> Alumni DS
                        <small>Digital Systems Department Graduates</small>
                    </h1>
                </div>
                <div class="col-md-8 col-6 text-end">
                    <button id="loginBtn" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </button>
                    <button id="registerBtn" class="btn btn-outline-light btn-sm ms-1" onclick="showRegisterForm()">
                        <i class="bi bi-person-plus"></i> Register
                    </button>
                    <span id="userInfo"></span>
                </div>
            </div>
        </div>
    </header>

    <!-- ============ STATS BAR ============ -->
    <div id="statsBar" class="stats-bar">
        <div class="container-fluid px-3">
            <span class="text-muted"><i class="bi bi-hourglass-split"></i> Loading...</span>
        </div>
    </div>

    <!-- ============ MAIN CONTENT ============ -->
    <div class="main-container">
        <div class="container-fluid h-100 px-0">
            <div class="row g-0 h-100">
                <!-- Map Column -->
                <div class="col-md-8 map-column">
                    <div class="card">
                        <div id="leaflet-map"></div>
                    </div>
                </div>

                <!-- Sidebar Column -->
                <div class="col-md-4 sidebar-column">
                    <div class="card">
                        <!-- Search Form -->
                        <div class="search-form">
                            <form id="searchForm">
                                <div class="row g-2">
                                    <div class="col-12">
                                        <input type="text" class="form-control" id="searchName" placeholder="Name">
                                    </div>
                                    <div class="col-6">
                                        <input type="number" class="form-control" id="searchEnrollmentYear" placeholder="Enroll Year">
                                    </div>
                                    <div class="col-6">
                                        <input type="number" class="form-control" id="searchGraduationYear" placeholder="Grad Year">
                                    </div>
                                    <div class="col-8">
                                        <input type="text" class="form-control" id="searchCountry" placeholder="Country">
                                    </div>
                                    <div class="col-4">
                                        <button type="submit" class="btn btn-primary w-100">
                                            <i class="bi bi-search"></i> Search
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>

                        <!-- Alumni List -->
                        <div id="alumniList">
                            <div class="text-center text-muted p-4">
                                <i class="bi bi-hourglass-split"></i> Loading...
                            </div>
                        </div>

                        <!-- Pagination -->
                        <div id="pagination" class="pagination-wrap"></div>

                        <!-- Chart -->
                        <div class="chart-container">
                            <div id="chart_div"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ LOGIN MODAL ============ -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-box-arrow-in-right"></i> Login</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <span class="spinner-border spinner-border-sm me-1" id="loginSpinner" style="display:none;"></span>
                            Login
                        </button>
                    </form>
                    <div class="mt-3 text-center">
                        <span class="auth-toggle" onclick="showRegisterForm()">Don't have an account? Register here</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ REGISTER MODAL ============ -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="bi bi-person-plus"></i> Register New Alumnus</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="regFirstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="regFirstName" required>
                            </div>
                            <div class="col-6">
                                <label for="regLastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="regLastName" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="regEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="regPassword" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="regEnrollmentYear" class="form-label">Enrollment Year</label>
                                <input type="number" class="form-control" id="regEnrollmentYear" required min="2000" max="2030">
                            </div>
                            <div class="col-6">
                                <label for="regGraduationYear" class="form-label">Graduation Year</label>
                                <input type="number" class="form-control" id="regGraduationYear" required min="2000" max="2030">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <span class="spinner-border spinner-border-sm me-1" id="registerSpinner" style="display:none;"></span>
                            Register
                        </button>
                    </form>
                    <div class="mt-3 text-center">
                        <span class="auth-toggle" onclick="hideModal('registerModal'); showModal('loginModal');">Already have an account? Login</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ JOBS MODAL ============ -->
    <div class="modal fade" id="jobsModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title"><i class="bi bi-briefcase"></i> Jobs: <span id="jobsModalLabel">Alumnus</span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="jobsContent">
                        <div class="text-center p-4"><div class="spinner-border text-primary" role="status"></div></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="addJobBtn" class="btn btn-primary" style="display:none;" onclick="showJobFormModal(state.selectedAlumnus.id)">
                        <i class="bi bi-plus-circle"></i> Add Job
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ JOB FORM MODAL ============ -->
    <div class="modal fade" id="jobFormModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title" id="jobFormModalLabel"><i class="bi bi-pencil"></i> Edit Job</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="jobForm">
                        <input type="hidden" id="jobFormJobId">
                        <input type="hidden" id="jobFormAlumnusId">
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="jobFormCompany" class="form-label">Company</label>
                                <input type="text" class="form-control" id="jobFormCompany" required>
                            </div>
                            <div class="col-6">
                                <label for="jobFormTitle" class="form-label">Job Title</label>
                                <input type="text" class="form-control" id="jobFormTitle" required>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="jobFormCountry" class="form-label">Country</label>
                                <input type="text" class="form-control" id="jobFormCountry" required>
                            </div>
                            <div class="col-6">
                                <label for="jobFormCity" class="form-label">City</label>
                                <input type="text" class="form-control" id="jobFormCity" required>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="jobFormLatitude" class="form-label">Latitude</label>
                                <input type="number" step="0.00000001" class="form-control" id="jobFormLatitude" required>
                            </div>
                            <div class="col-6">
                                <label for="jobFormLongitude" class="form-label">Longitude</label>
                                <input type="number" step="0.00000001" class="form-control" id="jobFormLongitude" required>
                            </div>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-8">
                                <label for="jobFormStartDate" class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="jobFormStartDate" required>
                            </div>
                            <div class="col-4 d-flex align-items-end">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="jobFormIsCurrent">
                                    <label class="form-check-label" for="jobFormIsCurrent">Current</label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">
                            <i class="bi bi-save"></i> Save Job
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- API Module -->
    <script src="js/api.js"></script>
    <!-- Map Module -->
    <script src="js/map.js"></script>
    <!-- Charts Module -->
    <script src="js/charts.js"></script>
    <!-- Main App -->
    <script src="js/app.js"></script>
</body>
</html>
